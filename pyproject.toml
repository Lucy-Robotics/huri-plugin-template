[build-system]
requires = ["setuptools>=64,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "huri-module-example"
version = "0.1.0"
description = "HuRI module example: shouts every finished transcript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huri-core[server]>=0.4.0.dev0,<0.5",
  "huri-events>=0.1,<0.2",          # the curated events it consumes
  # The events it introduces (events/): on no package index, so installed
  # together with the module, from the same checkout or tag (see the README).
  "huri-events-example>=0.1,<0.2",
  # Your module's own dependencies go here; hardware-specific pins go in
  # requirements-{cpu,nvidia,amd}.txt (install.sh picks one).
]

# Edit these: point them at your module's repository (pip and package indexes
# show them to whoever installs the module).
[project.urls]
Homepage = "https://github.com/your-org/huri-module-example"
Repository = "https://github.com/your-org/huri-module-example"
Issues = "https://github.com/your-org/huri-module-example/issues"

[project.optional-dependencies]
# flake8-pyproject: flake8 alone does not read [tool.flake8] below.
dev = ["pytest>=8", "black>=24", "isort>=5", "flake8>=7", "flake8-pyproject>=1.2"]

# How HuRI finds the module: once installed, `name: example` works in a client's
# YAML (and the server's HURI_MODULES).
[project.entry-points."huri.modules"]
example = "huri_example.module:Shouter"

[tool.setuptools.packages.find]
include = ["huri_example*"]

[tool.setuptools.package-data]
huri_example = ["huri_module.toml"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["huri_example", "huri_events_example"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203"]
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist", "*.egg-info"]
